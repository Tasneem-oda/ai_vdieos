<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الفيديوهات | مساحتك الآمنة</title>
    
    <!-- استخدام خط Cairo ليعطي طابعاً أكثر احترافية ووضوحاً في الشاشات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* نظام ألوان SaaS احترافي */
            --bg-color: #F8FAFC;
            --surface-color: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --primary-accent: #4F46E5;
            --primary-hover: #4338CA;
            --border-color: #E2E8F0;
            --danger: #EF4444;
            
            /* نظام مسافات ثابت */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            
            --border-radius: 12px;
            --transition-speed: 0.25s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Navigation */
        .top-nav {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-md) var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background-color: var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        /* Header Section */
        .page-header {
            padding: var(--spacing-xl) 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #EEF2FF;
            color: var(--primary-accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-accent);
            border-radius: 50%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Controls: Search & Stats */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto var(--spacing-xl) auto;
            padding: 0 5%;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-container i-lucide {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 20px;
            height: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color var(--transition-speed);
        }

        .search-input:focus {
            border-color: var(--primary-accent);
        }

        .video-stats {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Grid & Cards */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5% var(--spacing-xl) 5%;
        }

        .video-card {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.06);
        }

        .thumbnail-container {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            background-color: var(--border-color);
        }

        .video-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .thumbnail-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition-speed);
        }

        .video-card:hover .video-thumbnail {
            transform: scale(1.05);
        }

        .video-card:hover .thumbnail-overlay {
            opacity: 1;
        }

        .play-indicator {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-accent);
            transform: scale(0.8);
            transition: transform var(--transition-speed);
        }

        .video-card:hover .play-indicator {
            transform: scale(1);
        }

        .card-content {
            padding: var(--spacing-md);
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        /* Buttons Hierarchy */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .skeleton-thumb { height: 180px; width: 100%; }
        .skeleton-text { height: 16px; margin: 16px; width: 70%; }
        .skeleton-meta { height: 12px; margin: 0 16px 16px; width: 40%; }
        .skeleton-btn { height: 40px; margin: 8px 16px; border-radius: 8px; }

        /* States (Empty/Error) */
        .state-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            border: 1px dashed var(--border-color);
        }

        .state-icon {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            width: 48px;
            height: 48px;
        }
        
        .error-icon { color: var(--danger); }

        /* Premium Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal-container {
            position: relative;
            width: 95%;
            max-width: 900px;
            margin: 40px auto;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal.show .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
            color: white;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .video-grid { grid-template-columns: 1fr; }
            .btn-group { flex-direction: row; }
            .modal-container { margin: 20px auto; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="brand">
            <i data-lucide="play-square" style="color: var(--primary-accent);"></i>
            <span>مساحتك الآمنة</span>
        </div>
        <div class="user-avatar">
            <i data-lucide="user"></i>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="page-header">
        <div class="status-badge">
            <span class="dot"></span> مكتبتك الشخصية
        </div>
        <h1>مكتبة الفيديوهات</h1>
        <p class="subtitle">كل محتواك في مكان واحد، جاهز للمشاهدة والتحميل متى شئت.</p>
    </header>

    <!-- Controls (Search & Meta) -->
    <div class="controls-bar">
        <div class="search-container">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيديو بحسب الاسم...">
        </div>
        <div class="video-stats" id="statsContainer">
            جاري جلب البيانات...
        </div>
    </div>

    <!-- Video Grid -->
    <main class="video-grid" id="video-container">
        <!-- Skeleton Loading State -->
        <div class="skeleton-card">
            <div class="skeleton skeleton-thumb"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-meta"></div>
            <div class="skeleton skeleton-btn"></div>
            <div class="skeleton skeleton-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton skeleton-thumb"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-meta"></div>
            <div class="skeleton skeleton-btn"></div>
            <div class="skeleton skeleton-btn"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton skeleton-thumb"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-meta"></div>
            <div class="skeleton skeleton-btn"></div>
            <div class="skeleton skeleton-btn"></div>
        </div>
    </main>

    <!-- Premium Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">جاري التحميل...</h3>
                <button class="close-btn" onclick="closeModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoPlayer" src="" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>
    </div>

    <script>
        // تهيئة المتغيرات
        const container = document.getElementById('video-container');
        const statsContainer = document.getElementById('statsContainer');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');
        const modalTitle = document.getElementById('modalTitle');
        
        let allVideos = []; // لتخزين البيانات محلياً من أجل البحث

        // تفعيل أيقونات Lucide
        lucide.createIcons();

        // تنسيق التاريخ ليظهر بشكل احترافي
        function formatDate(dateString) {
            if (!dateString) return 'تم الإضافة مؤخراً';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ar-EG', options);
        }

        // تنظيف اسم الملف (إزالة الامتداد مثل .mp4)
        function cleanTitle(name) {
            if (!name) return 'فيديو بدون عنوان';
            return name.replace(/\.[^/.]+$/, "");
        }

        // جلب البيانات من n8n
        fetch('https://tasneemahmed-n8n.hf.space/webhook/0a83a687-92b4-411e-995c-0e540af9342f', {
            method: 'GET'
        })
        .then(response => {
            if (!response.ok) throw new Error('فشل الاتصال بالخادم');
            return response.json();
        })
        .then(data => {
            allVideos = data || [];
            renderVideos(allVideos);
        })
        .catch(error => {
            console.error('Error:', error);
            renderErrorState();
        });

        // دالة عرض الفيديوهات (تدعم البحث)
        function renderVideos(videos) {
            // تحديث الإحصائيات
            statsContainer.innerHTML = `${videos.length} فيديو متاح • آخر تحديث اليوم`;

            if (videos.length === 0) {
                renderEmptyState();
                return;
            }

            container.innerHTML = videos.map((video, index) => {
                const title = cleanTitle(video.name) || `فيديو ${index + 1}`;
                const date = formatDate(video.createdTime);
                const thumbImg = video.thumbnailLink ? video.thumbnailLink.replace('=s220', '=s600') : '';
                
                // حساب التأخير الزمني لظهور الكروت تدريجياً (Staggered Animation)
                const delay = index * 0.05;

                return `
                <div class="video-card" style="animation-delay: ${delay}s">
                    <div class="thumbnail-container">
                        ${thumbImg ? `<img src="${thumbImg}" class="video-thumbnail" alt="${title}" loading="lazy">` 
                                   : `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#E2E8F0; color:#64748B;">لا توجد صورة مصغرة</div>`}
                        
                        <div class="thumbnail-overlay">
                            <div class="play-indicator">
                                <i data-lucide="play" fill="currentColor"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-content">
                        <div class="video-title" title="${title}">${title}</div>
                        <div class="video-meta">أُضيف في: ${date}</div>
                        
                        <div class="btn-group">
                            <button onclick="openModal('${video.id}', '${title}')" class="btn btn-primary">
                                <i data-lucide="play-circle"></i> مشاهدة الفيديو
                            </button>
                            <a href="https://drive.google.com/uc?export=download&id=${video.id}" target="_blank" class="btn btn-secondary">
                                <i data-lucide="download"></i> تحميل
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            // إعادة تهيئة الأيقونات للكروت الجديدة
            lucide.createIcons();
        }

        // تفعيل محرك البحث المحلي
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredVideos = allVideos.filter(video => 
                (video.name || '').toLowerCase().includes(searchTerm)
            );
            renderVideos(filteredVideos);
        });

        // دوال التحكم في النافذة المنبثقة
        function openModal(videoId, title) {
            player.src = `https://drive.google.com/file/d/${videoId}/preview`;
            modalTitle.innerText = title;
            modal.style.display = "block";
            // تفعيل حركة الظهور (Fade-in)
            setTimeout(() => modal.classList.add('show'), 10);
            document.body.style.overflow = 'hidden'; // منع التمرير في الخلفية
        }

        function closeModal() {
            modal.classList.remove('show');
            // انتظار انتهاء الحركة قبل إخفاء العنصر وتفريغ المصدر
            setTimeout(() => {
                modal.style.display = "none";
                player.src = ""; 
                document.body.style.overflow = 'auto';
            }, 300);
        }

        // إغلاق النافذة عند الضغط خارجها أو بالضغط على زر ESC
        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && modal.style.display === "block") closeModal();
        });

        // دالة عرض حالة الفراغ (Empty State)
        function renderEmptyState() {
            container.innerHTML = `
                <div class="state-container">
                    <i data-lucide="video-off" class="state-icon"></i>
                    <h2>لا توجد فيديوهات</h2>
                    <p style="color: var(--text-secondary); margin-top: 8px;">لم يتم العثور على أي فيديوهات في المكتبة حالياً.</p>
                </div>
            `;
            lucide.createIcons();
        }

        // دالة عرض حالة الخطأ (Error State)
        function renderErrorState() {
            container.innerHTML = `
                <div class="state-container">
                    <i data-lucide="alert-circle" class="state-icon error-icon"></i>
                    <h2>تعذر تحميل المكتبة</h2>
                    <p style="color: var(--text-secondary); margin-top: 8px;">حدثت مشكلة أثناء الاتصال بالخادم. يرجى التأكد من تشغيل الـ Webhook.</p>
                    <button onclick="location.reload()" class="btn btn-secondary" style="width: auto; margin-top: 16px;">
                        <i data-lucide="refresh-cw"></i> إعادة المحاولة
                    </button>
                </div>
            `;
            statsContainer.innerHTML = 'فشل التحميل';
            lucide.createIcons();
        }
    </script>
</body>
</html>
