<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مكتبة الفيديوهات</title>


    <!-- =========================
         GOOGLE FONT
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --primary: #635BFF;
            --primary-dark: #5148E5;
            --primary-soft: #F0EFFF;

            --cyan: #22D3EE;
            --cyan-soft: #ECFEFF;

            --bg: #F8FAFC;
            --surface: #FFFFFF;

            --text: #101828;
            --text-secondary: #667085;
            --text-muted: #98A2B3;

            --border: #EAECF0;

            --success: #12B76A;
            --danger: #F04438;

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;

            --shadow-sm:
                0 2px 10px rgba(16, 24, 40, .04);

            --shadow-md:
                0 16px 40px rgba(16, 24, 40, .08);

            --shadow-lg:
                0 30px 90px rgba(16, 24, 40, .20);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                'IBM Plex Sans Arabic',
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% -10%,
                    rgba(99, 91, 255, .12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(34, 211, 238, .10),
                    transparent 28%
                ),

                var(--bg);

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;

        }


        button,
        input {
            font-family: inherit;
        }


        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =====================================================
           AMBIENT BACKGROUND
        ===================================================== */

        .ambient {

            position: fixed;

            inset: 0;

            z-index: -1;

            pointer-events: none;

            overflow: hidden;

        }


        .ambient-orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(70px);

            opacity: .55;

            will-change: transform;

        }


        .orb-purple {

            width: 380px;
            height: 380px;

            top: -170px;
            right: 10%;

            background:
                rgba(99, 91, 255, .11);

            animation:
                floatPurple
                20s
                ease-in-out
                infinite;

        }


        .orb-cyan {

            width: 320px;
            height: 320px;

            top: 35%;
            left: -170px;

            background:
                rgba(34, 211, 238, .08);

            animation:
                floatCyan
                24s
                ease-in-out
                infinite;

        }


        .orb-small {

            width: 180px;
            height: 180px;

            right: -80px;
            bottom: 12%;

            background:
                rgba(99, 91, 255, .07);

            animation:
                floatSmall
                18s
                ease-in-out
                infinite;

        }


        @keyframes floatPurple {

            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-40px, 35px, 0)
                    scale(1.08);
            }

        }


        @keyframes floatCyan {

            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(55px, -30px, 0)
                    scale(1.12);
            }

        }


        @keyframes floatSmall {

            0%,
            100% {
                transform:
                    translate3d(0, 0, 0);
            }

            50% {
                transform:
                    translate3d(-35px, -25px, 0);
            }

        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 32px;

            background:
                rgba(255, 255, 255, .76);

            border-bottom:
                1px solid
                rgba(234, 236, 240, .75);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .brand-icon {

            width: 42px;
            height: 42px;

            display: grid;

            place-items: center;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #756DFF
                );

            box-shadow:
                0 8px 22px
                rgba(99, 91, 255, .22);

            position: relative;

            overflow: hidden;

        }


        .brand-icon::after {

            content: "";

            position: absolute;

            width: 60px;
            height: 60px;

            border-radius: 50%;

            background:
                rgba(34, 211, 238, .25);

            top: -35px;
            left: -20px;

            filter: blur(12px);

            animation:
                iconGlow
                4s
                ease-in-out
                infinite;

        }


        @keyframes iconGlow {

            0%,
            100% {
                transform:
                    translate(0, 0);
            }

            50% {
                transform:
                    translate(22px, 15px);
            }

        }


        .brand-icon svg {

            width: 20px;
            height: 20px;

            position: relative;

            z-index: 2;

        }


        .brand-text {

            font-size: 17px;

            font-weight: 700;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 9px;

            color:
                var(--text-secondary);

            font-size: 13px;

        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--success);

            box-shadow:
                0 0 0 4px
                rgba(18, 183, 106, .10);

            animation:
                statusPulse
                2.4s
                ease-in-out
                infinite;

        }


        @keyframes statusPulse {

            0%,
            100% {
                box-shadow:
                    0 0 0 4px
                    rgba(18, 183, 106, .10);
            }

            50% {
                box-shadow:
                    0 0 0 7px
                    rgba(18, 183, 106, .03);
            }

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width:
                min(
                    1180px,
                    calc(100% - 40px)
                );

            margin:
                0 auto;

            padding:
                65px 0 90px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            text-align: center;

            max-width: 720px;

            margin:
                0 auto 45px;

            animation:
                heroIn
                .75s
                cubic-bezier(.2, .8, .2, 1)
                both;

        }


        .hero::before {

            content: "";

            position: absolute;

            width: 280px;
            height: 150px;

            left: 50%;
            top: 20px;

            transform:
                translateX(-50%);

            background:
                radial-gradient(
                    ellipse,
                    rgba(99, 91, 255, .10),
                    transparent 70%
                );

            filter:
                blur(15px);

            z-index: -1;

            animation:
                heroGlow
                8s
                ease-in-out
                infinite;

        }


        @keyframes heroGlow {

            0%,
            100% {
                transform:
                    translateX(-50%)
                    scale(1);
                opacity: .7;
            }

            50% {
                transform:
                    translateX(-50%)
                    scale(1.15);
                opacity: 1;
            }

        }


        .hero-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap: 7px;

            padding:
                7px 13px;

            border-radius:
                999px;

            background:
                linear-gradient(
                    135deg,
                    rgba(99, 91, 255, .08),
                    rgba(34, 211, 238, .08)
                );

            border:
                1px solid
                rgba(99, 91, 255, .10);

            color:
                var(--primary);

            font-size:
                13px;

            font-weight:
                600;

            margin-bottom:
                18px;

        }


        .hero-badge svg {

            width: 15px;
            height: 15px;

        }


        h1 {

            margin:
                0 0 13px;

            font-size:
                clamp(
                    34px,
                    5vw,
                    50px
                );

            line-height:
                1.15;

            letter-spacing:
                -.9px;

            background:
                linear-gradient(
                    110deg,
                    #101828 35%,
                    #635BFF 70%,
                    #22AFC7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        .hero-description {

            margin: 0;

            color:
                var(--text-secondary);

            font-size:
                16px;

            line-height:
                1.85;

        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap: 16px;

            margin-bottom:
                27px;

            padding:
                12px;

            background:
                rgba(255,255,255,.76);

            border:
                1px solid
                rgba(234,236,240,.9);

            border-radius:
                18px;

            box-shadow:
                var(--shadow-sm);

            backdrop-filter:
                blur(14px);

        }


        .search-box {

            position:
                relative;

            flex:
                1;

        }


        .search-box svg {

            position:
                absolute;

            right:
                14px;

            top:
                50%;

            width:
                19px;

            height:
                19px;

            color:
                var(--text-muted);

            transform:
                translateY(-50%);

        }


        .search-box input {

            width:
                100%;

            height:
                46px;

            border:
                1px solid
                transparent;

            border-radius:
                12px;

            background:
                #F8FAFC;

            padding:
                0 45px 0 16px;

            outline:
                none;

            color:
                var(--text);

            font-size:
                14px;

            transition:
                .2s ease;

        }


        .search-box input::placeholder {

            color:
                #98A2B3;

        }


        .search-box input:focus {

            background:
                white;

            border-color:
                rgba(99,91,255,.30);

            box-shadow:
                0 0 0 4px
                rgba(99,91,255,.07);

        }


        .video-count {

            white-space:
                nowrap;

            padding:
                0 14px;

            color:
                var(--text-secondary);

            font-size:
                14px;

            font-weight:
                500;

        }


        /* =====================================================
           GRID
        ===================================================== */

        .video-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap:
                22px;

        }


        /* =====================================================
           VIDEO CARD
        ===================================================== */

        .video-card {

            position:
                relative;

            overflow:
                hidden;

            background:
                var(--surface);

            border:
                1px solid
                var(--border);

            border-radius:
                var(--radius-lg);

            box-shadow:
                var(--shadow-sm);

            transition:
                transform .32s
                    cubic-bezier(.2,.8,.2,1),
                box-shadow .32s ease,
                border-color .32s ease;

            animation:
                cardIn
                .65s
                cubic-bezier(.2,.8,.2,1)
                both;

            animation-delay:
                var(--delay);

        }


        /*
        Animated gradient glow
        */

        .video-card::before {

            content: "";

            position:
                absolute;

            inset:
                -1px;

            border-radius:
                inherit;

            padding:
                1px;

            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    rgba(99,91,255,.0),
                    rgba(34,211,238,.0),
                    transparent 80%
                );

            background-size:
                200% 200%;

            -webkit-mask:
                linear-gradient(#fff 0 0)
                content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite:
                xor;

            mask-composite:
                exclude;

            opacity:
                0;

            transition:
                opacity .35s ease;

            pointer-events:
                none;

            animation:
                borderFlow
                5s
                linear
                infinite;

        }


        .video-card:hover::before {

            opacity:
                1;

        }


        @keyframes borderFlow {

            0% {
                background-position:
                    0% 50%;
            }

            50% {
                background-position:
                    100% 50%;
            }

            100% {
                background-position:
                    0% 50%;
            }

        }


        .video-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 18px 45px
                rgba(16,24,40,.10);

            border-color:
                rgba(99,91,255,.14);

        }


        /* =====================================================
           THUMBNAIL
        ===================================================== */

        .thumbnail-container {

            position:
                relative;

            aspect-ratio:
                16 / 9;

            overflow:
                hidden;

            background:
                linear-gradient(
                    135deg,
                    #F0EFFF,
                    #ECFEFF
                );

        }


        .video-thumbnail {

            width:
                100%;

            height:
                100%;

            display:
                block;

            object-fit:
                cover;

            transition:
                transform .65s
                cubic-bezier(.2,.8,.2,1);

        }


        .video-card:hover
        .video-thumbnail {

            transform:
                scale(1.055);

        }


        .thumbnail-container::after {

            content: "";

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0,0,0,.05),
                    transparent 55%,
                    rgba(0,0,0,.16)
                );

            pointer-events:
                none;

        }


        .thumbnail-overlay {

            position:
                absolute;

            inset:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(17,24,39,.18);

            opacity:
                0;

            transition:
                opacity .3s ease;

            z-index:
                3;

        }


        .video-card:hover
        .thumbnail-overlay {

            opacity:
                1;

        }


        .play-circle {

            width:
                56px;

            height:
                56px;

            display:
                grid;

            place-items:
                center;

            border:
                0;

            border-radius:
                50%;

            background:
                rgba(255,255,255,.95);

            color:
                var(--primary);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.18);

            cursor:
                pointer;

            transform:
                scale(.82);

            transition:
                transform .35s
                cubic-bezier(.2,.8,.2,1);

        }


        .video-card:hover
        .play-circle {

            transform:
                scale(1);

        }


        .play-circle:hover {

            transform:
                scale(1.08);

        }


        .play-circle svg {

            width:
                21px;

            height:
                21px;

            transform:
                translateX(-1px);

        }


        .video-number {

            position:
                absolute;

            top:
                12px;

            right:
                12px;

            padding:
                5px 9px;

            border-radius:
                8px;

            background:
                rgba(17,24,39,.60);

            backdrop-filter:
                blur(8px);

            color:
                white;

            font-size:
                12px;

            font-weight:
                600;

            z-index:
                4;

        }


        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .card-content {

            padding:
                18px;

        }


        .video-title {

            margin:
                0 0 7px;

            font-size:
                16px;

            font-weight:
                700;

            color:
                var(--text);

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .video-meta {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            margin-bottom:
                17px;

            color:
                var(--text-muted);

            font-size:
                12px;

        }


        .meta-dot {

            width:
                3px;

            height:
                3px;

            border-radius:
                50%;

            background:
                #CBD5E1;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .button-group {

            display:
                grid;

            grid-template-columns:
                1fr 48px;

            gap:
                9px;

        }


        .btn {

            height:
                44px;

            border:
                0;

            border-radius:
                12px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            cursor:
                pointer;

            font-size:
                13px;

            font-weight:
                600;

            text-decoration:
                none;

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;

        }


        .btn svg {

            width:
                17px;

            height:
                17px;

        }


        .btn-watch {

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #746DFF
                );

            box-shadow:
                0 7px 18px
                rgba(99,91,255,.18);

        }


        .btn-watch:hover {

            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    #635BFF
                );

            box-shadow:
                0 9px 24px
                rgba(99,91,255,.26);

            transform:
                translateY(-1px);

        }


        .btn-download {

            color:
                var(--text-secondary);

            background:
                #F2F4F7;

        }


        .btn-download:hover {

            background:
                #E8F9FB;

            color:
                #0891A5;

        }


        .btn:active {

            transform:
                scale(.97);

        }


        /* =====================================================
           STATES
        ===================================================== */

        .state {

            grid-column:
                1 / -1;

            text-align:
                center;

            padding:
                80px 20px;

        }


        .state-icon {

            width:
                66px;

            height:
                66px;

            display:
                grid;

            place-items:
                center;

            margin:
                0 auto 18px;

            border-radius:
                18px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-soft),
                    var(--cyan-soft)
                );

            color:
                var(--primary);

        }


        .state-icon svg {

            width:
                29px;

            height:
                29px;

        }


        .state h2 {

            margin:
                0 0 7px;

            font-size:
                20px;

        }


        .state p {

            margin:
                0 auto 20px;

            max-width:
                420px;

            color:
                var(--text-secondary);

            font-size:
                14px;

            line-height:
                1.7;

        }


        .retry-btn {

            padding:
                11px 20px;

            border:
                0;

            border-radius:
                10px;

            background:
                var(--primary);

            color:
                white;

            cursor:
                pointer;

            font-weight:
                600;

        }


        /* =====================================================
           SKELETON
        ===================================================== */

        .skeleton-card {

            overflow:
                hidden;

            border:
                1px solid
                var(--border);

            border-radius:
                var(--radius-lg);

            background:
                white;

        }


        .skeleton {

            position:
                relative;

            overflow:
                hidden;

            background:
                #EAECF0;

        }


        .skeleton::after {

            content: "";

            position:
                absolute;

            inset:
                0;

            transform:
                translateX(-100%);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.60),
                    transparent
                );

            animation:
                shimmer
                1.5s
                infinite;

        }


        .skeleton-image {

            aspect-ratio:
                16 / 9;

        }


        .skeleton-content {

            padding:
                18px;

        }


        .skeleton-title {

            height:
                17px;

            width:
                65%;

            border-radius:
                6px;

            margin-bottom:
                12px;

        }


        .skeleton-meta {

            height:
                12px;

            width:
                38%;

            border-radius:
                6px;

            margin-bottom:
                18px;

        }


        .skeleton-button {

            height:
                44px;

            border-radius:
                12px;

        }


        @keyframes shimmer {

            100% {
                transform:
                    translateX(100%);
            }

        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            position:
                fixed;

            inset:
                0;

            z-index:
                1000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                25px;

            background:
                rgba(3,7,18,.78);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            opacity:
                0;

            visibility:
                hidden;

            transition:
                opacity .3s ease,
                visibility .3s ease;

        }


        .modal.active {

            opacity:
                1;

            visibility:
                visible;

        }


        .modal-container {

            width:
                min(
                    900px,
                    100%
                );

            transform:
                translateY(18px)
                scale(.965);

            transition:
                transform .4s
                cubic-bezier(.2,.8,.2,1);

        }


        .modal.active
        .modal-container {

            transform:
                translateY(0)
                scale(1);

        }


        .modal-top {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                12px;

        }


        .modal-title {

            color:
                white;

            font-size:
                15px;

            font-weight:
                600;

            max-width:
                calc(100% - 55px);

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;

        }


        .close-btn {

            width:
                40px;

            height:
                40px;

            display:
                grid;

            place-items:
                center;

            border:
                0;

            border-radius:
                11px;

            background:
                rgba(255,255,255,.10);

            color:
                white;

            cursor:
                pointer;

            transition:

        .video-wrapper {

            background:

            box-shadow:

        .video-wrapper::before {

            content: "";

            position:

            inset:

            border:

            border-radius:

            pointer-events:

        .video-wrapper iframe {

        /* =====================================================

        /* =====================================================

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           CONFIG
        ================================================= */

        const API_URL =
            'https://tasneemahmed-n8n.hf.space/webhook/0a83a687-92b4-411e-995c-0e540af9342f';


        /* =================================================
           DOM
        ================================================= */

        const container =
            document.getElementById(
                'video-container'
            );


        const modal =
            document.getElementById(
                'videoModal'
            );


        const player =
            document.getElementById(
                'videoPlayer'
            );


        const closeModalButton =
            document.getElementById(
                'closeModal'
            );


        const modalTitle =
            document.getElementById(
                'modalTitle'
            );


        const searchInput =
            document.getElementById(
                'searchInput'
            );


        const videoCount =
            document.getElementById(
                'videoCount'
            );


        let videos = [];


        /* =================================================
           ICONS
        ================================================= */

        const icons = {

            play: `
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <polygon
                        points="5 3 19 12 5 21 5 3"
                    ></polygon>
                </svg>
            `,


            download: `
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M12 3v12"
                    ></path>

                    <path
                        d="m7 10 5 5 5-5"
                    ></path>

                    <path
                        d="M5 21h14"
                    ></path>

                </svg>
            `,


            video: `
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <polygon
                        points="23 7 16 12 23 17 23 7"
                    ></polygon>

                    <rect
                        x="1"
                        y="5"
                        width="15"
                        height="14"
                        rx="2"
                        ry="2"
                    ></rect>

                </svg>
            `,


            search: `
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="8"
                    ></circle>

                    <path
                        d="m21 21-4.3-4.3"
                    ></path>

                </svg>
            `

        };


        /* =================================================
           LOAD VIDEOS
        ================================================= */

        async function loadVideos() {

            showLoading();


            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: 'GET'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        'فشل الاتصال بالخادم'
                    );

                }


                const data =
                    await response.json();


                if (
                    !Array.isArray(data) ||
                    data.length === 0
                ) {

                    videos = [];

                    showEmpty();

                    updateCount();

                    return;

                }


                videos =
                    data.map(
                        (video, index) => ({

                            ...video,

                            originalIndex:
                                index + 1

                        })
                    );


                renderVideos(
                    videos
                );


                updateCount();

            }


            catch (error) {

                console.error(
                    'Error:',
                    error
                );

                showError();

            }

        }


        /* =================================================
           RENDER
        ================================================= */

        function renderVideos(
            list
        ) {

            if (!list.length) {

                container.innerHTML = `

                    <div class="state">

                        <div class="state-icon">

                            ${icons.search}

                        </div>

                        <h2>
                            لم نجد أي نتائج
                        </h2>

                        <p>
                            جرّبي البحث بكلمة مختلفة
                            أو امسحي البحث لعرض كل الفيديوهات.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                list.map(
                    (
                        video,
                        index
                    ) => {


                        const thumbnail =
                            video.thumbnailLink
                                ? video.thumbnailLink
                                    .replace(
                                        '=s220',
                                        '=s600'
                                    )
                                : '';


                        const title =
                            video.name ||
                            video.title ||
                            `الفيديو ${
                                String(
                                    video.originalIndex
                                ).padStart(
                                    2,
                                    '0'
                                )
                            }`;


                        const thumbnailHTML =
                            thumbnail

                            ? `

                                <img
                                    src="${thumbnail}"
                                    class="video-thumbnail"
                                    alt="${escapeHTML(
                                        title
                                    )}"
                                    loading="lazy"
                                >

                            `

                            : `

                                <div
                                    class="video-thumbnail"
                                    style="
                                        display:grid;
                                        place-items:center;
                                        color:#98A2B3;
                                    "
                                >

                                    ${icons.video}

                                </div>

                            `;


                        return `

                            <article
                                class="video-card"
                                style="
                                    --delay:
                                    ${Math.min(
                                        index * 45,
                                        450
                                    )}ms
                                "
                            >


                                <div
                                    class="
                                        thumbnail-container
                                    "
                                >

                                    ${thumbnailHTML}


                                    <div
                                        class="
                                            thumbnail-overlay
                                        "
                                    >

                                        <button
                                            class="
                                                play-circle
                                            "
                                            onclick="
                                                openModal(
                                                    '${escapeAttribute(
                                                        video.id
                                                    )}',
                                                    '${escapeAttribute(
                                                        title
                                                    )}'
                                                )
                                            "
                                            aria-label="
                                                مشاهدة الفيديو
                                            "
                                        >

                                            ${icons.play}

                                        </button>

                                    </div>


                                    <div
                                        class="
                                            video-number
                                        "
                                    >

                                        ${String(
                                            video.originalIndex
                                        ).padStart(
                                            2,
                                            '0'
                                        )}

                                    </div>

                                </div>


                                <div
                                    class="
                                        card-content
                                    "
                                >

                                    <h2
                                        class="
                                            video-title
                                        "
                                        title="${escapeHTML(
                                            title
                                        )}"
                                    >

                                        ${escapeHTML(
                                            title
                                        )}

                                    </h2>


                                    <div
                                        class="
                                            video-meta
                                        "
                                    >

                                        <span>
                                            فيديو
                                        </span>

                                        <span
                                            class="
                                                meta-dot
                                            "
                                        ></span>

                                        <span>
                                            متاح للمشاهدة والتحميل
                                        </span>

                                    </div>


                                    <div
                                        class="
                                            button-group
                                        "
                                    >

                                        <button
                                            class="
                                                btn
                                                btn-watch
                                            "
                                            onclick="
                                                openModal(
                                                    '${escapeAttribute(
                                                        video.id
                                                    )}',
                                                    '${escapeAttribute(
                                                        title
                                                    )}'
                                                )
                                            "
                                        >

                                            ${icons.play}

                                            مشاهدة الفيديو

                                        </button>


                                        <a
                                            href="
                                                https://drive.google.com/uc?export=download&id=${encodeURIComponent(
                                                    video.id
                                                )}
                                            "
                                            target="_blank"
                                            rel="
                                                noopener
                                                noreferrer
                                            "
                                            class="
                                                btn
                                                btn-download
                                            "
                                            aria-label="
                                                تحميل الفيديو
                                            "
                                            title="
                                                تحميل الفيديو
                                            "
                                        >

                                            ${icons.download}

                                        </a>

                                    </div>

                                </div>

                            </article>

                        `;

                    }
                )
                .join('');

        }


        /* =================================================
           SEARCH
        ================================================= */

        searchInput.addEventListener(
            'input',
            function () {

                const query =
                    this.value
                        .trim()
                        .toLowerCase();


                if (!query) {

                    renderVideos(
                        videos
                    );

                    updateCount();

                    return;

                }


                const filtered =
                    videos.filter(
                        video => {

                            const title =
                                video.name ||
                                video.title ||
                                `الفيديو ${
                                    video.originalIndex
                                }`;


                            return title
                                .toLowerCase()
                                .includes(
                                    query
                                );

                        }
                    );


                renderVideos(
                    filtered
                );


                updateCount(
                    filtered.length
                );

            }
        );


        /* =================================================
           MODAL
        ================================================= */

        function openModal(
            videoId,
            title
        ) {

            player.src =
                `https://drive.google.com/file/${videoId}/preview`;


            modalTitle.textContent =
                title ||
                'مشاهدة الفيديو';


            modal.classList.add(
                'active'
            );


            modal.setAttribute(
                'aria-hidden',
                'false'
            );


            document.body.style.overflow =
                'hidden';

        }


        function closeModal() {

            modal.classList.remove(
                'active'
            );


            modal.setAttribute(
                'aria-hidden',
                'true'
            );


            setTimeout(
                () => {

                    player.src =
                        '';

                },
                250
            );


            document.body.style.overflow =
                '';

        }


        closeModalButton.addEventListener(
            'click',
            closeModal
        );


        modal.addEventListener(
            'click',
            function(event) {

                if (
                    event.target === modal
                ) {

                    closeModal();

                }

            }
        );


        document.addEventListener(
            'keydown',
            function(event) {

                if (
                    event.key === 'Escape' &&
                    modal.classList.contains(
                        'active'
                    )
                ) {

                    closeModal();

                }

            }
        );


        /* =================================================
           STATES
        ================================================= */

        function showLoading() {

            videoCount.textContent =
                'جاري التحميل...';


            container.innerHTML = `

                ${Array.from(
                    {
                        length: 6
                    },
                    () => `

                        <div
                            class="
                                skeleton-card
                            "
                        >

                            <div
                                class="
                                    skeleton
                                    skeleton-image
                                "
                            ></div>


                            <div
                                class="
                                    skeleton-content
                                "
                            >

                                <div
                                    class="
                                        skeleton
                                        skeleton-title
                                    "
                                ></div>


                                <div
                                    class="
                                        skeleton
                                        skeleton-meta
                                    "
                                ></div>


                                <div
                                    class="
                                        skeleton
                                        skeleton-button
                                    "
                                ></div>

                            </div>

                        </div>

                    `
                ).join('')}

            `;

        }


        function showEmpty() {

            container.innerHTML = `

                <div class="state">

                    <div class="state-icon">

                        ${icons.video}

                    </div>

                    <h2>
                        لا توجد فيديوهات حاليًا
                    </h2>

                    <p>
                        لم تتم إضافة أي فيديوهات
                        إلى مكتبتك حتى الآن.
                    </p>

                </div>

            `;

        }


        function showError() {

            videoCount.textContent =
                'تعذر الاتصال';


            container.innerHTML = `

                <div class="state">

                    <div
                        class="state-icon"
                        style="
                            background:#FEF3F2;
                            color:#F04438;
                        "
                    >

                        ${icons.video}

                    </div>


                    <h2>
                        تعذر تحميل الفيديوهات
                    </h2>


                    <p>
                        حصلت مشكلة مؤقتة أثناء
                        الاتصال بالخادم.
                        حاول مرة أخرى.
                    </p>


                    <button
                        class="retry-btn"
                        onclick="
                            loadVideos()
                        "
                    >

                        حاول مرة أخرى

                    </button>

                </div>

            `;

        }


        /* =================================================
           COUNT
        ================================================= */

        function updateCount(
            count = videos.length
        ) {

            if (
                count === 0
            ) {

                videoCount.textContent =
                    'لا توجد فيديوهات';

                return;

            }


            videoCount.textContent =
                `${count} ${
                    count === 1
                        ? 'فيديو'
                        : 'فيديوهات'
                }`;

        }


        /* =================================================
           SECURITY HELPERS
        ================================================= */

        function escapeHTML(
            value
        ) {

            return String(value)
                .replace(
                    /[&<>"']/g,
                    char => ({

                        '&':
                            '&amp;',

                        '<':
                            '&lt;',

                        '>':
                            '&gt;',

                        '"':
                            '&quot;',

                        "'":
                            '&#039;'

                    }[char])
                );

        }


        function escapeAttribute(
            value
        ) {

            return String(value)

                .replace(
                    /\\/g,
                    '\\\\'
                )

                .replace(
                    /'/g,
                    "\\'"
                );

        }


        /* =================================================
           START
        ================================================= */

        loadVideos();


    </script>
