<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحتك الآمنة - الفيديوهات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        :root {
            --primary: #A7C7E7;
            --secondary: #BBDEDB;
            --bg: #F9FBFD;
            --text: #4A5568;
            --card-bg: #FFFFFF;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header-container {
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.2rem;
            color: #5C7C8A;
            margin-bottom: 10px;
        }
        
        p.subtitle {
            font-size: 1.1rem;
            color: #718096;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .video-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #E2E8F0;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
        }
        
        .video-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
            line-height: 1.5;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 0;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
            display: inline-block;
        }
        
        .btn-watch {
            background-color: var(--primary);
            color: #2D3748;
        }
        
        .btn-download {
            background-color: var(--secondary);
            color: #2D3748;
        }
        
        .btn:hover {
            filter: brightness(0.95);
        }

        .loading {
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>رحلتك نحو الهدوء</h1>
        <p class="subtitle">خذ نفساً عميقاً.. اختر ما تود مشاهدته اليوم</p>
    </div>
    
    <div class="video-grid" id="video-container">
        <div class="loading">جاري تحميل الفيديوهات...</div>
    </div>

    <script>
        const container = document.getElementById('video-container');

        // استخدام مسار /webhook/ المخصص للإنتاج
        fetch('https://tasneemahmed-n8n.hf.space/webhook/0a83a687-92b4-411e-995c-0e540af9342f', {
            method: 'GET'
        })
        .then(response => {
            if (!response.ok) throw new Error('فشل الاتصال بالخادم');
            return response.json();
        })
        .then(data => {
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">لا توجد فيديوهات متاحة حالياً.</div>';
                return;
            }

            // بناء العناصر ديناميكياً وترقيمها
            container.innerHTML = data.map((video, index) => `
                <div class="video-card">
                    <div class="video-title"># ${index + 1}</div>
                    <div class="button-group">
                        <a href="https://drive.google.com/file/d/${video.id}/view" target="_blank" class="btn btn-watch">مشاهدة 👁️</a>
                        <a href="https://drive.google.com/uc?export=download&id=${video.id}" target="_blank" class="btn btn-download">تحميل ⬇️</a>
                    </div>
                </div>
            `).join('');
        })
        .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<div class="loading" style="color: red;">حدث خطأ أثناء جلب الفيديوهات. يرجى المحاولة لاحقاً.</div>';
        });
    </script>
</body>
</html>
