<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحتك الآمنة - الفيديوهات</title>
    <style>
        /* Importing a soft, friendly Arabic font */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        :root {
            --primary: #A7C7E7; /* Pastel blue - calming and trusting */
            --secondary: #BBDEDB; /* Pastel mint - refreshing */
            --bg: #F9FBFD; /* Very soft off-white/blue for less eye strain */
            --text: #4A5568; /* Soft dark gray instead of harsh black */
            --card-bg: #FFFFFF;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header-container {
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.2rem;
            color: #5C7C8A;
            margin-bottom: 10px;
        }
        
        p.subtitle {
            font-size: 1.1rem;
            color: #718096;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .video-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #E2E8F0;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
        }
        
        .video-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
            line-height: 1.5;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 0;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
            display: inline-block;
        }
        
        .btn-watch {
            background-color: var(--primary);
            color: #2D3748;
        }
        
        .btn-download {
            background-color: var(--secondary);
            color: #2D3748;
        }
        
        .btn:hover {
            filter: brightness(0.95);
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>رحلتك نحو الهدوء</h1>
        <p class="subtitle">خذ نفساً عميقاً.. اختر ما تود مشاهدته اليوم</p>
    </div>
    
    <div class="video-grid">
        {{ $input.all().map(item => item.json).sort((a, b) => new Date(b['Upload Time'] || 0) - new Date(a['Upload Time'] || 0)).map(row => `
        <div class="video-card">
            <div class="video-title">${row['Hook'] || 'محتوى للاسترخاء'}</div>
            <div class="button-group">
                <a href="${row['Final Video']}" target="_blank" class="btn btn-watch">مشاهدة 👁️</a>
                <a href="${row['Final Video']}" download target="_blank" class="btn btn-download">تحميل ⬇️</a>
            </div>
        </div>
        `).join('') }}
    </div>
</body>
</html>
