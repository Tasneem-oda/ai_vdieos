<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الفيديوهات</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           ROOT & NIGHT THEME
        ===================================================== */
        :root {
            /* تعديل الألوان لتناسب المظهر الليلي */
            --primary: #8B5CF6; 
            --primary-dark: #7C3AED;
            --primary-soft: rgba(139, 92, 246, 0.1);

            --cyan: #22D3EE;
            --cyan-soft: rgba(34, 211, 238, 0.1);

            --bg: #030712;       /* أسود عميق جداً */
            --surface: #111827;  /* كحلي داكن للكروت */

            --text: #F9FAFB;     /* أبيض ناصع للنصوص */
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;

            --border: #1F2937;   /* حدود داكنة */

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;

            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 25px rgba(139, 92, 246, 0.4); /* تأثير التوهج */
        }

        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative; /* ضروري لخلفية النجوم */
        }

        button, input { font-family: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }

        /* =====================================================
           NIGHT SKY & STARS ANIMATION
        ===================================================== */
        .stars-container {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background: radial-gradient(circle at bottom, #111827 0%, #030712 100%);
        }

        /* توليد النجوم بخاصية box-shadow لتوفير الموارد */
        .stars, .stars2, .stars3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 2px;
            background: transparent;
            /* عينة من النجوم، يمكن زيادتها برمجياً أو باستخدام SCSS، هنا نموذج CSS نقي */
            box-shadow: 
                20vw 10vh #FFF, 40vw 30vh #FFF, 60vw 20vh #FFF, 80vw 40vh #FFF,
                10vw 60vh #FFF, 30vw 80vh #FFF, 50vw 70vh #FFF, 70vw 90vh #FFF,
                90vw 10vh #FFF, 15vw 95vh #FFF, 85vw 60vh #FFF, 55vw 45vh #FFF;
            animation: animStar 50s linear infinite;
        }

        .stars2 {
            width: 3px;
            height: 3px;
            box-shadow: 
                25vw 15vh #FFF, 45vw 35vh #FFF, 65vw 25vh #FFF, 85vw 45vh #FFF,
                15vw 65vh #FFF, 35vw 85vh #FFF, 55vw 75vh #FFF, 75vw 95vh #FFF;
            animation: animStar 100s linear infinite;
        }

        .stars3 {
            width: 4px;
            height: 4px;
            box-shadow: 
                30vw 20vh #FFF, 50vw 40vh #FFF, 70vw 30vh #FFF, 90vw 50vh #FFF;
            animation: animStar 150s linear infinite;
            border-radius: 50%;
        }

        @keyframes animStar {
            from { transform: translateY(0); }
            to { transform: translateY(-100vh); } /* النجوم تتحرك لأعلى */
        }

        /* =====================================================
           AMBIENT ORBS
        ===================================================== */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3; /* تقليل الشفافية لتبدو أفضل مع الظلام */
            will-change: transform;
        }

        .orb-purple {
            width: 400px;
            height: 400px;
            top: -150px;
            right: 5%;
            background: rgba(139, 92, 246, 0.4);
            animation: floatPurple 20s ease-in-out infinite;
        }

        .orb-cyan {
            width: 350px;
            height: 350px;
            top: 40%;
            left: -100px;
            background: rgba(34, 211, 238, 0.2);
            animation: floatCyan 24s ease-in-out infinite;
        }

        @keyframes floatPurple {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-30px, 40px, 0) scale(1.05); }
        }

        @keyframes floatCyan {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(40px, -20px, 0) scale(1.1); }
        }

        /* =====================================================
           TOPBAR
        ===================================================== */
        .topbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(17, 24, 39, 0.8); /* توافق مع الثيم المظلم */
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 42px; height: 42px;
            display: grid; place-items: center;
            border-radius: 13px; color: white;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            box-shadow: 0 8px 22px rgba(139, 92, 246, 0.3);
            position: relative; overflow: hidden;
        }
        .brand-icon svg { width: 20px; height: 20px; position: relative; z-index: 2; }
        .brand-text { font-size: 17px; font-weight: 700; color: #FFF; }
        
        .status { display: flex; align-items: center; gap: 9px; color: var(--text-secondary); font-size: 13px; }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
            animation: statusPulse 2.4s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
            50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0.05); }
        }

        /* =====================================================
           MAIN & HERO
        ===================================================== */
        main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 65px 0 90px; }

        .hero { position: relative; text-align: center; max-width: 720px; margin: 0 auto 45px; animation: heroIn .75s cubic-bezier(.2, .8, .2, 1) both; }
        
        .hero-badge {
            display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px;
            border-radius: 999px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #C4B5FD; font-size: 13px; font-weight: 600; margin-bottom: 18px;
        }
        .hero-badge svg { width: 15px; height: 15px; }

        h1 {
            margin: 0 0 13px; font-size: clamp(34px, 5vw, 50px); line-height: 1.15; letter-spacing: -.9px;
            background: linear-gradient(110deg, #F9FAFB 35%, #A78BFA 70%, #22D3EE 100%);
            -webkit-background-clip: text; color: transparent;
        }
        .hero-description { margin: 0; color: var(--text-secondary); font-size: 16px; line-height: 1.85; }

        /* =====================================================
           TOOLBAR
        ===================================================== */
        .toolbar {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            margin-bottom: 27px; padding: 12px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px; box-shadow: var(--shadow-sm);
            backdrop-filter: blur(14px);
        }

        .search-box { position: relative; flex: 1; }
        .search-box svg { position: absolute; right: 14px; top: 50%; width: 19px; height: 19px; color: var(--text-muted); transform: translateY(-50%); }
        .search-box input {
            width: 100%; height: 46px; border: 1px solid transparent; border-radius: 12px;
            background: rgba(17, 24, 39, 0.8); padding: 0 45px 0 16px; outline: none;
            color: var(--text); font-size: 14px; transition: .2s ease;
        }
        .search-box input::placeholder { color: #6B7280; }
        .search-box input:focus { background: #1F2937; border-color: rgba(139, 92, 246, 0.5); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }
        .video-count { white-space: nowrap; padding: 0 14px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }

        /* =====================================================
           GRID
        ===================================================== */
        .video-grid {
            display: grid;
            /* تعديل عرض الأعمدة لتناسب الكروت الطولية */
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        /* =====================================================
           VIDEO CARD (SHORTS STYLE)
        ===================================================== */
        .video-card {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
            animation: cardIn .65s cubic-bezier(.2,.8,.2,1) both;
            animation-delay: var(--delay);
            display: flex;
            flex-direction: column;
        }

        /* توهج خفيف عند الـ Hover */
        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-glow);
            border-color: rgba(139, 92, 246, 0.4);
        }

        /* =====================================================
           THUMBNAIL (9:16 ASPECT RATIO)
        ===================================================== */
        .thumbnail-container {
            position: relative;
            aspect-ratio: 9 / 16; /* أبعاد طولية مثل الفيديوهات القصيرة */
            overflow: hidden;
            background: #1F2937;
        }

        .video-thumbnail {
            width: 100%; height: 100%; display: block; object-fit: cover;
            transition: transform .6s ease;
            /* تحسين الصورة الداكنة */
            filter: brightness(0.9);
        }

        .video-card:hover .video-thumbnail { transform: scale(1.06); filter: brightness(1); }

        .thumbnail-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.4); opacity: 0; transition: opacity .3s ease; z-index: 3;
        }
        .video-card:hover .thumbnail-overlay { opacity: 1; }

        .play-circle {
            width: 50px; height: 50px; display: grid; place-items: center;
            border: 0; border-radius: 50%; background: rgba(255,255,255,0.9);
            color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.5);
            cursor: pointer; transform: scale(.8); transition: transform .3s ease;
        }
        .video-card:hover .play-circle { transform: scale(1); }
        .play-circle:hover { transform: scale(1.1); background: #FFF; }
        .play-circle svg { width: 20px; height: 20px; transform: translateX(-1px); }

        .video-number {
            position: absolute; top: 12px; right: 12px; padding: 5px 9px;
            border-radius: 8px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            color: white; font-size: 12px; font-weight: 600; z-index: 4;
        }

        /* =====================================================
           CARD CONTENT
        ===================================================== */
        .card-content { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .video-title {
            margin: 0 0 6px; font-size: 15px; font-weight: 600; color: #FFF;
            /* السماح بسطرين للعنوان في الكروت الطولية */
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .video-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; color: var(--text-muted); font-size: 11px; margin-top: auto; }
        .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: #4B5563; }

        /* =====================================================
           BUTTONS (STACKED FOR NARROW CARDS)
        ===================================================== */
        .button-group {
            display: flex; flex-direction: column; gap: 8px; /* وضع الأزرار فوق بعضها */
        }

        .btn {
            height: 40px; border: 0; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none;
            transition: all .2s ease; width: 100%;
        }
        .btn svg { width: 16px; height: 16px; }

        .btn-watch { color: white; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-watch:hover { background: var(--primary); border-color: var(--primary); }

        .btn-download { color: var(--text-secondary); background: transparent; }
        .btn-download:hover { color: #FFF; background: rgba(255, 255, 255, 0.05); }

        /* =====================================================
           STATES & SKELETON
        ===================================================== */
        .state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; }
        .state-icon { width: 66px; height: 66px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; background: rgba(31, 41, 55, 0.8); color: var(--text-muted); }
        
        .skeleton-card { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); display: flex; flex-direction: column; }
        .skeleton { position: relative; overflow: hidden; background: #1F2937; }
        .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent); animation: shimmer 1.5s infinite; }
        .skeleton-image { aspect-ratio: 9 / 16; }
        .skeleton-content { padding: 16px; }
        .skeleton-title { height: 16px; width: 80%; border-radius: 6px; margin-bottom: 12px; }
        .skeleton-meta { height: 12px; width: 50%; border-radius: 6px; margin-bottom: 16px; }
        .skeleton-button { height: 40px; border-radius: 10px; margin-bottom: 8px; }

        @keyframes shimmer { 100% { transform: translateX(100%); } }
        @keyframes cardIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heroIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        /* =====================================================
           MODAL (VERTICAL ORIENTED)
        ===================================================== */
        .modal {
            position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px);
            opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-container {
            /* تعديل الحاوية لتناسب الفيديوهات الطولية */
            width: min(500px, 100%); height: 90vh; display: flex; flex-direction: column;
            transform: translateY(18px) scale(.965); transition: transform .4s cubic-bezier(.2,.8,.2,1);
        }
        .modal.active .modal-container { transform: translateY(0) scale(1); }

        .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .modal-title { color: white; font-size: 15px; font-weight: 600; max-width: calc(100% - 55px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        .close-btn {
            width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 11px;
            background: rgba(255,255,255,.1); color: white; cursor: pointer; transition: background .2s, transform .2s;
        }
        .close-btn:hover { background: rgba(255,255,255,.2); transform: rotate(5deg); }
        .close-btn svg { width: 18px; height: 18px; }

        .video-wrapper {
            position: relative; overflow: hidden; width: 100%; flex-grow: 1; /* تأخذ المساحة المتبقية */
            border-radius: 18px; background: black; box-shadow: var(--shadow-glow);
        }
        .video-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        @media (max-width: 650px) {
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            h1 { font-size: 28px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .modal-container { height: 100%; padding-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- STAR BACKGROUND LAYER -->
    <div class="stars-container" aria-hidden="true">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <!-- AMBIENT ORBS -->
    <div class="ambient" aria-hidden="true">
        <div class="ambient-orb orb-purple"></div>
        <div class="ambient-orb orb-cyan"></div>
    </div>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </div>
            <div class="brand-text">مكتبة الفيديوهات</div>
        </div>
        <div class="status">
            <span class="status-dot"></span> متصل
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-badge">مكتبتك الشخصية</div>
            <h1>محتواك في مساحتك الخاصة</h1>
            <p class="hero-description">تصفح الفيديوهات الطولية بسهولة في بيئة هادئة ومظلمة.</p>
        </section>

        <section class="toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                <input id="searchInput" type="search" placeholder="ابحث عن فيديو..." autocomplete="off">
            </div>
            <div class="video-count" id="videoCount">جاري التحميل...</div>
        </section>

        <section class="video-grid" id="video-container">
            <!-- Skeletons -->
            <div class="skeleton-card">
                <div class="skeleton skeleton-image"></div>
                <div class="skeleton-content">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-meta"></div>
                    <div class="skeleton skeleton-button"></div>
                    <div class="skeleton skeleton-button" style="background: transparent; border: 1px solid #1F2937;"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton skeleton-image"></div>
                <div class="skeleton-content">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-meta"></div>
                    <div class="skeleton skeleton-button"></div>
                    <div class="skeleton skeleton-button" style="background: transparent; border: 1px solid #1F2937;"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton skeleton-image"></div>
                <div class="skeleton-content">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-meta"></div>
                    <div class="skeleton skeleton-button"></div>
                    <div class="skeleton skeleton-button" style="background: transparent; border: 1px solid #1F2937;"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="videoModal" class="modal" aria-hidden="true">
        <div class="modal-container">
            <div class="modal-top">
                <div class="modal-title" id="modalTitle">مشاهدة الفيديو</div>
                <button class="close-btn" id="closeModal" aria-label="إغلاق">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="video-wrapper">
                <iframe id="videoPlayer" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://tasneemahmed-n8n.hf.space/webhook/0a83a687-92b4-411e-995c-0e540af9342f';
        const container = document.getElementById('video-container');
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');
        const closeModalButton = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const searchInput = document.getElementById('searchInput');
        const videoCount = document.getElementById('videoCount');
        let videos = [];

        const icons = {
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
            download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>`,
            video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`
        };

        async function loadVideos() {
            try {
                const response = await fetch(API_URL, { method: 'GET' });
                if (!response.ok) throw new Error('فشل الاتصال');
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    videos = [];
                    showEmpty();
                    updateCount();
                    return;
                }
                
                videos = data.map((video, index) => ({ ...video, originalIndex: index + 1 }));
                renderVideos(videos);
                updateCount();
            } catch (error) {
                console.error(error);
                showError();
            }
        }

        function renderVideos(list) {
            if (!list.length) {
                container.innerHTML = `<div class="state"><div class="state-icon">${icons.video}</div><h2>لا توجد نتائج</h2></div>`;
                return;
            }

            container.innerHTML = list.map((video, index) => {
                const thumbnail = video.thumbnailLink ? video.thumbnailLink.replace('=s220', '=s600') : '';
                const title = video.name || video.title || `الفيديو ${String(video.originalIndex).padStart(2, '0')}`;
                
                const thumbnailHTML = thumbnail 
                    ? `<img src="${thumbnail}" class="video-thumbnail" alt="${escapeHTML(title)}" loading="lazy">` 
                    : `<div class="video-thumbnail" style="display:grid; place-items:center; color:#6B7280;">${icons.video}</div>`;

                return `
                    <article class="video-card" style="--delay: ${Math.min(index * 45, 450)}ms">
                        <div class="thumbnail-container">
                            ${thumbnailHTML}
                            <div class="thumbnail-overlay">
                                <button class="play-circle" onclick="openModal('${escapeAttribute(video.id)}', '${escapeAttribute(title)}')">${icons.play}</button>
                            </div>
                            <div class="video-number">${String(video.originalIndex).padStart(2, '0')}</div>
                        </div>
                        <div class="card-content">
                            <h2 class="video-title" title="${escapeHTML(title)}">${escapeHTML(title)}</h2>
                            <div class="video-meta"><span>فيديو عمودي</span><span class="meta-dot"></span><span>جاهز</span></div>
                            <div class="button-group">
                                <button class="btn btn-watch" onclick="openModal('${escapeAttribute(video.id)}', '${escapeAttribute(title)}')">${icons.play} مشاهدة</button>
                                <a href="https://drive.google.com/uc?export=download&id=${encodeURIComponent(video.id)}" target="_blank" class="btn btn-download">${icons.download} تحميل</a>
                            </div>
                        </div>
                    </article>`;
            }).join('');
        }

        searchInput.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            if (!query) { renderVideos(videos); updateCount(); return; }
            const filtered = videos.filter(v => {
                const t = v.name || v.title || `الفيديو ${v.originalIndex}`;
                return t.toLowerCase().includes(query);
            });
            renderVideos(filtered); updateCount(filtered.length);
        });

        function openModal(videoId, title) {
            player.src = `https://drive.google.com/file/${videoId}/preview`;
            modalTitle.textContent = title || 'مشاهدة الفيديو';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => { player.src = ''; }, 250);
            document.body.style.overflow = '';
        }

        closeModalButton.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });

        function showEmpty() { container.innerHTML = `<div class="state"><h2>لا توجد فيديوهات</h2></div>`; }
        function showError() { container.innerHTML = `<div class="state"><h2 style="color:var(--primary);">حدث خطأ في الاتصال</h2></div>`; }
        function updateCount(count = videos.length) { videoCount.textContent = count === 0 ? 'لا توجد فيديوهات' : `${count} فيديو`; }

        function escapeHTML(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }
        function escapeAttribute(value) { return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

        loadVideos();
    </script>
</body>
</html>
